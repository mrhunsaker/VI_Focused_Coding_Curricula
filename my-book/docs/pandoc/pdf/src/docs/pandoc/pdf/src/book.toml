[book]
title = "Accessible Introduction to Computer Science"
authors = ["Michael Ryan Hunsaker, M.Ed., Ph.D."]
language = "en"
description = "Introductory programming curricula, each adapted for visually impaired students who use screen readers"
src = "."

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "Rust"
preferred-dark-theme = "Navy"
site-url = "/VI_Focused_Coding_Curricula/"
git-repository-url = "https://github.com/mrhunsaker/VI_Focused_Coding_Curricula"

[output.html.search]
enable = true
limit-results = 50
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1

[output.pandoc]
number-internal-headings = false 
list-internal-headings = false 

[output.pandoc.code]
show-hidden-lines = true

[output.pandoc.profile.pdf]
output-file = "VI_Focused_Coding_Curricula.pdf"
to = "latex"
pdf-engine = "xelatex"
file-scope = true 
number-sections = true 
standalone = true 
table-of-contents = true 
