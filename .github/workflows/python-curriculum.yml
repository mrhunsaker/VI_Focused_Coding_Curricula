name: Python canonical curriculum examples

on:
  push:
    paths:
      - "PYTHON/**"
      - "scripts/check_python_curriculum.py"
      - ".github/workflows/python-curriculum.yml"
  pull_request:
    paths:
      - "PYTHON/**"
      - "scripts/check_python_curriculum.py"
      - ".github/workflows/python-curriculum.yml"
  workflow_dispatch:

jobs:
  canonical-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute canonical examples and assert output
        run: python scripts/check_python_curriculum.py
