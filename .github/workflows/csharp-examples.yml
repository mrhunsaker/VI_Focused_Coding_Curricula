name: C# curriculum example validation

on:
  push:
    branches:
      - 2026-11-01-curriculum-expansion
      - audit/fix-python-lua-standardization
    paths:
      - "CSHARP/lessons.md"
      - "scripts/check_csharp_examples.py"
      - ".github/workflows/csharp-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-check:
    name: .NET 10 / C# 14
    runs-on: ubuntu-latest
    steps:
      - name: Check out curriculum
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify SDK
        run: dotnet --info
      - name: Compile and link every C# lesson example
        run: python3 scripts/check_csharp_examples.py
