name: Kotlin 1.9 curriculum examples

on:
  push:
    paths:
      - "KOTLIN/**"
      - "SUMMARY.md"
      - "book.toml"
      - "scripts/check_kotlin_curriculum.mjs"
      - "scripts/check_kotlin_examples.py"
      - ".github/workflows/kotlin-curriculum.yml"
  pull_request:
    paths:
      - "KOTLIN/**"
      - "scripts/check_kotlin_curriculum.mjs"
      - "scripts/check_kotlin_examples.py"
      - ".github/workflows/kotlin-curriculum.yml"
  workflow_dispatch:

jobs:
  kotlin-1-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin compiler 1.9.24
        run: |
          curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip --output "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: |
          java --version
          kotlinc -version
      - name: Check lesson structure
        run: node scripts/check_kotlin_curriculum.mjs
      - name: Compile, execute, and assert all 57 examples
        run: python3 scripts/check_kotlin_examples.py
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - name: Build the complete curriculum book
        run: mdbook build
