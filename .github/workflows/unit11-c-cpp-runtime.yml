name: Unit 11 C and C++ capstone runtime acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-cpp-capstones:
    name: Compile and test C and C++ capstone cores
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JSON development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libjson-c-dev nlohmann-json3-dev pkg-config
      - name: Compile and test C core
        run: |
          gcc -D_GNU_SOURCE -std=c17 -Wall -Wextra -Werror \
            my-book/src/C/capstone/records.c my-book/src/C/capstone/test_records.c \
            $(pkg-config --cflags --libs json-c) \
            -o "$RUNNER_TEMP/c-capstone-tests"
          "$RUNNER_TEMP/c-capstone-tests"
      - name: Compile and test C++ core
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Imy-book/src/CPP/capstone \
            my-book/src/CPP/capstone/test_records.cpp -o "$RUNNER_TEMP/cpp-capstone-tests"
          "$RUNNER_TEMP/cpp-capstone-tests"
