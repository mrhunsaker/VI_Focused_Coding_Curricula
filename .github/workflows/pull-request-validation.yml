name: Pull request curriculum validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Validate repository JSON
        run: |
          python -m json.tool lesson_standardization.json > /dev/null
          python -m json.tool KOTLIN/examples_expected.json > /dev/null
          python -m json.tool backmatter/indexing_setup.json > /dev/null

      - name: Scan text sources for unresolved merge markers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          extensions = {
              ".md", ".json", ".py", ".js", ".mjs", ".ts", ".tsx",
              ".java", ".kt", ".kts", ".lua", ".rs", ".go", ".c",
              ".h", ".cpp", ".hpp", ".cs", ".swift", ".jl", ".toml",
              ".yml", ".yaml", ".sh", ".ps1", ".txt", ".html", ".css",
              ".sql", ".r", ".R",
          }
          marker = re.compile(r"^(?:<<<<<<< |=======$|>>>>>>> |\\|{7} )")
          failures = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix not in extensions:
                  continue
              if any(part in {".git", "book", "target", "node_modules", ".venv"} for part in path.parts):
                  continue
              try:
                  lines = path.read_text(encoding="utf-8").splitlines()
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(lines, 1):
                  if marker.match(line):
                      failures.append(f"{path}:{number}: {line}")
          if failures:
              print("\n".join(failures))
              raise SystemExit(f"Found {len(failures)} unresolved merge-marker lines.")
          print("No unresolved merge-marker lines found in scanned text sources.")
          PY

      - name: Test Python capstone record operations
        run: python -m unittest discover -s PYTHON/capstone -p "test_records.py" -v

      - name: Check Kotlin lesson structure and local links
        run: node scripts/check_kotlin_curriculum.mjs

      - name: Build mdBook
        run: mdbook build
